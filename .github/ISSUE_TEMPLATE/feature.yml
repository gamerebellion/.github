name: Feature
description: Propose a change or a new capability.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want changed, and how someone would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
